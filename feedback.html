<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1 align="center">FEEDBACK</h1>

<!-- MESSAGE BOX -->
<p id="message" style="text-align:center; color:red; font-weight:bold;"></p>

<table border="1" width="80%" align="center" cellpadding="20">
    <tr>
        <td>
            <h2 align="center">FEEDBACK FORM</h2>

            <form onsubmit="return validateForm()">

                <table width="100%" cellpadding="10">

                    <tr>
                        <td>Name:</td>
                        <td><input type="text" id="name" size="50"></td>
                    </tr>

                    <tr>
                        <td>Email:</td>
                        <td><input type="email" id="email" size="50"></td>
                    </tr>

                    <tr>
                        <td>Rating:</td>
                        <td>
                            ☆ ☆ ☆ ☆ ☆ (Select rating)
                        </td>
                    </tr>

                    <tr>
                        <td>Your Feedback:</td>
                        <td>
                            <textarea id="feedback" rows="5" cols="50"></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td align="center">
                            <button type="submit">SUBMIT FEEDBACK</button>
                        </td>
                    </tr>

                </table>
            </form>

        </td>
    </tr>
</table>

<!-- JAVASCRIPT VALIDATION -->
<script>
function validateForm() {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let feedback = document.getElementById("feedback").value;

    let message = document.getElementById("message");

    if (name === "" || email === "" || feedback === "") {
        message.innerHTML = "⚠️ Please fill in all required fields before submitting!";
        return false; // stops form submission
    }

    message.innerHTML = "✅ Feedback submitted successfully!";
    message.style.color = "green";

    return true;
}
</script>

</body>
</html>
