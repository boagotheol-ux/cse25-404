<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1 align="center">CONTACT US</h1>

<p align="center">We’d love to hear from you</p>
<p align="center">Fill in the form or use our details below</p>

<br>

<table border="1" width="80%" align="center" cellpadding="20">
    <tr>
        <td>

            <h2 align="center">CONTACT FORM</h2>

            <form id="contactForm">

                <table width="100%" cellpadding="10">

                    <tr>
                        <td width="20%">Name:</td>

                        <td>
                            <input type="text"
                                   name="name"
                                   id="name"
                                   size="50"
                                   required>
                        </td>
                    </tr>

                    <tr>
                        <td>Email:</td>

                        <td>
                            <input type="email"
                                   name="email"
                                   id="email"
                                   size="50"
                                   required>
                        </td>
                    </tr>

                    <tr>
                        <td>Phone:</td>

                        <td>
                            <input type="text"
                                   name="phone"
                                   id="phone"
                                   size="50"
                                   required>
                        </td>
                    </tr>

                    <tr>
                        <td>Message:</td>

                        <td>
                            <textarea name="message"
                                      id="message"
                                      rows="5"
                                      cols="50"
                                      required></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td></td>

                        <td align="center">
                            <button type="submit">
                                SEND MESSAGE
                            </button>
                        </td>
                    </tr>

                </table>

            </form>

        </td>
    </tr>
</table>

<br><br>

<table border="1" width="80%" align="center" cellpadding="20">
    <tr>
        <td>

            <h2 align="center">CONTACT DETAILS</h2>

            <table width="100%" cellpadding="10">

                <tr>
                    <td width="10%" align="center" style="font-size:24px;">
                        📧
                    </td>

                    <td>Email: kalawa@gmail.com</td>
                </tr>

                <tr>
                    <td align="center" style="font-size:24px;">
                        📞
                    </td>

                    <td>Phone: +267 4633677</td>
                </tr>

                <tr>
                    <td align="center" style="font-size:24px;">
                        📍
                    </td>

                    <td>Location: Gaborone, Botswana</td>
                </tr>

            </table>

        </td>
    </tr>
</table>

<!-- JavaScript Validation -->

<script>

document.getElementById("contactForm").addEventListener("submit", function(event) {

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let message = document.getElementById("message").value.trim();

    if(name === "" || email === "" || phone === "" || message === "") {

        alert("Please fill in all fields.");

        event.preventDefault();
    }

    else if(phone.length < 7) {

        alert("Please enter a valid phone number.");

        event.preventDefault();
    }

    else {

        alert("Message sent successfully!");

    }

});

</script>

</body>
</html>
